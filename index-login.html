<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driver Daily Collection</title><style>*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#f3f6f9;color:#17202a}.hidden{display:none}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.box,.card,table{background:#fff;border-radius:12px;box-shadow:0 2px 10px #0001}.loginbox{width:390px;padding:25px}.loginbox input,.toolbar input,.modal input{width:100%;padding:12px;margin:6px 0;border:1px solid #cbd5e1;border-radius:9px}.btn{padding:11px 14px;border:0;border-radius:9px;background:#111827;color:#fff;cursor:pointer}.err{color:#b91c1c;font-size:13px;margin:6px 0}header{background:#111827;color:#fff;padding:15px}.head{max-width:1000px;margin:auto;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:21px}header p{margin:5px 0;color:#cbd5e1;font-size:13px}.logout{background:transparent;color:#fff;border:1px solid #64748b;padding:8px 11px;border-radius:8px}.container{max-width:1000px;margin:auto;padding:14px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{padding:14px}.label{font-size:12px;color:#64748b}.value{font-size:20px;font-weight:bold;margin-top:5px}.toolbar{display:flex;gap:8px;margin:14px 0}.toolbar input{flex:1;margin:0}.secondary{background:#475569}.note{color:#64748b;font-size:12px;margin:10px 2px}table{width:100%;border-collapse:collapse;overflow:hidden}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #eef2f7}th{background:#f8fafc;color:#64748b;font-size:12px}.status{border:0;border-radius:20px;padding:8px 12px;font-weight:bold;cursor:pointer}.paid{background:#dcfce7;color:#166534}.pending{background:#fef3c7;color:#92400e}.small{border:0;border-radius:7px;padding:7px 9px;margin-right:4px;cursor:pointer}.edit{background:#e2e8f0}.del{background:#fee2e2;color:#991b1b}.loading{text-align:center;padding:25px;color:#64748b}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.modal .box{width:430px;padding:18px}.actions{display:flex;gap:8px}.actions button{flex:1}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}.toolbar{flex-wrap:wrap}.toolbar input{min-width:100%}th:nth-child(3),td:nth-child(3){display:none}}</style></head><body>
<div id="login" class="login"><div class="loginbox box"><h1>🚗 Driver Daily Collection</h1><p>Admin Login</p><input id="email" type="email" placeholder="Admin email"><input id="pass" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()"><div id="err" class="err"></div><button class="btn" style="width:100%" onclick="login()">Login</button></div></div>
<div id="app" class="hidden"><header><div class="head"><div><h1>🚗 Driver Daily Collection</h1><p id="date"></p></div><button class="logout" onclick="logout()">Logout</button></div></header><div class="container"><div class="cards"><div class="card"><div class="label">Daily Rent / Driver</div><div class="value" id="daily">—</div></div><div class="card"><div class="label">Active Drivers</div><div class="value" id="count">—</div></div><div class="card"><div class="label">Collected Today</div><div class="value" id="collected">—</div></div><div class="card"><div class="label">Pending Today</div><div class="value" id="pending">—</div></div></div><div class="toolbar"><input id="search" placeholder="Search driver..." oninput="render()"><button class="btn" onclick="openModal()">＋ Add Driver</button><button class="btn secondary" onclick="load()">↻ Refresh</button></div><div class="note">Monthly rent: <b>Rs. 85,000</b> · Daily amount is automatic for the current month.</div><div id="table"><div class="loading">Loading…</div></div></div></div>
<div id="modal" class="modal"><div class="box"><h2 id="mt">Add Driver</h2><input id="name" placeholder="Driver name *"><input id="phone" placeholder="Phone number"><input id="car" placeholder="Car number"><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="save()">Save</button></div></div></div>
<script>const P='https://mmnxsavyqyviooljrdko.supabase.co',A=P+'/rest/v1',K='sb_publishable_FbPVZ0gTJev9Xbomp4TpNg_0GRr38Di',R=85000;let s=null,ds=[],ps=[],eid=null;const pad=n=>String(n).padStart(2,'0'),today=()=>{let d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())},days=()=>{let d=new Date();return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()},day=()=>Math.round(R/days()),money=n=>'Rs. '+Number(n).toLocaleString('en-PK'),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function H(){return{apikey:K,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'}}async function api(x,o={}){let r=await fetch(A+x,{...o,headers:{...H(),...(o.headers||{})}});if(r.status==401){logout();throw Error('Session expired')}if(!r.ok)throw Error(await r.text());return r.status==204?null:r.json()}
async function login(){let email=document.getElementById('email').value.trim(),password=document.getElementById('pass').value;document.getElementById('err').textContent='';if(!email||!password){document.getElementById('err').textContent='Email aur password enter karein.';return}try{let r=await fetch(P+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email,password})}),d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||'Login failed');s=d;localStorage.setItem('dcs',JSON.stringify(d));show();load()}catch(e){document.getElementById('err').textContent=e.message}}
function show(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('date').textContent=new Date().toLocaleDateString('en-PK',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}async function logout(){try{if(s)await fetch(P+'/auth/v1/logout',{method:'POST',headers:H()})}catch(e){}s=null;localStorage.removeItem('dcs');document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
async function load(){try{ds=await api('/drivers?active=eq.true&order=name.asc');ps=await api('/payments?payment_date=eq.'+today()+'&select=id,driver_id,payment_time,amount');render()}catch(e){if(s)document.getElementById('table').innerHTML='<div class="loading">'+esc(e.message)+'</div>'}}
function render(){let q=document.getElementById('search').value.toLowerCase(),d=day(),m={};ps.forEach(p=>m[p.driver_id]=p);let pc=ds.filter(x=>m[x.id]).length;document.getElementById('daily').textContent=money(d);document.getElementById('count').textContent=ds.length;document.getElementById('collected').textContent=money(pc*d);document.getElementById('pending').textContent=money((ds.length-pc)*d);let l=ds.filter(x=>(x.name+' '+(x.phone||'')+' '+(x.car_number||'')).toLowerCase().includes(q));if(!l.length){document.getElementById('table').innerHTML='<div class="loading">No drivers found.</div>';return}document.getElementById('table').innerHTML='<table><thead><tr><th>Driver</th><th>Daily Rent</th><th>Payment Time</th><th>Status</th><th>Action</th></tr></thead><tbody>'+l.map(x=>{let p=m[x.id];return '<tr><td><b>'+esc(x.name)+'</b><br><small>'+esc(x.car_number||'')+(x.phone?' · '+esc(x.phone):'')+'</small></td><td>'+money(d)+'</td><td>'+(p?new Date(p.payment_time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'—')+'</td><td><button class="status '+(p?'paid':'pending')+'" onclick="pay('+x.id+')">'+(p?'✓ Paid':'Pending')+'</button></td><td><button class="small edit" onclick="edit('+x.id+')">Edit</button><button class="small del" onclick="deact('+x.id+')">Deactivate</button></td></tr>'}).join('')+'</tbody></table>'}
function openModal(x=null){eid=x?.id||null;document.getElementById('mt').textContent=x?'Edit Driver':'Add Driver';document.getElementById('name').value=x?.name||'';document.getElementById('phone').value=x?.phone||'';document.getElementById('car').value=x?.car_number||'';document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function edit(id){openModal(ds.find(x=>x.id===id))}
async function save(){let n=document.getElementById('name').value.trim();if(!n)return alert('Driver name enter karein.');let b={name:n,phone:document.getElementById('phone').value.trim()||null,car_number:document.getElementById('car').value.trim()||null,monthly_rent:R,active:true};try{await api(eid?'/drivers?id=eq.'+eid:'/drivers',{method:eid?'PATCH':'POST',body:JSON.stringify(b)});closeModal();load()}catch(e){alert(e.message)}}async function pay(id){let p=ps.find(x=>x.driver_id===id);try{if(p)await api('/payments?id=eq.'+p.id,{method:'DELETE'});else await api('/payments',{method:'POST',body:JSON.stringify({driver_id:id,payment_date:today(),amount:day()})});load()}catch(e){alert(e.message)}}async function deact(id){if(!confirm('Is driver ko deactivate karna hai?'))return;try{await api('/drivers?id=eq.'+id,{method:'PATCH',body:JSON.stringify({active:false})});load()}catch(e){alert(e.message)}}try{let x=JSON.parse(localStorage.getItem('dcs'));if(x?.access_token){s=x;show();load()}}catch(e){}</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driver Daily Collection</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f6f9;color:#17202a}header{background:#111827;color:#fff;padding:18px 16px}header h1{margin:0;font-size:21px}header p{margin:5px 0 0;color:#cbd5e1;font-size:13px}.container{max-width:1000px;margin:auto;padding:14px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 9px #0001}.label{font-size:12px;color:#64748b}.value{font-size:20px;font-weight:700;margin-top:5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar button,.modal input{padding:11px;border:1px solid #d1d5db;border-radius:9px;font-size:14px}.toolbar input{flex:1;min-width:180px}.btn{border:0!important;background:#111827;color:#fff;cursor:pointer}.btn.secondary{background:#475569}table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 9px #0001}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #eef2f7;font-size:14px}th{background:#f8fafc;color:#64748b;font-size:12px}.status{border:0;border-radius:20px;padding:8px 12px;font-weight:700;cursor:pointer}.paid{background:#dcfce7;color:#166534}.pending{background:#fef3c7;color:#92400e}.smallbtn{border:0;border-radius:7px;padding:7px 9px;cursor:pointer;margin-right:4px}.edit{background:#e2e8f0}.del{background:#fee2e2;color:#991b1b}.note{font-size:12px;color:#64748b;margin:10px 2px}.loading{text-align:center;padding:25px;color:#64748b}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:30;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{background:#fff;width:min(430px,100%);border-radius:14px;padding:18px}.box h2{margin:0 0 14px;font-size:19px}.box input{width:100%;margin-bottom:9px}.actions{display:flex;gap:8px}.actions button{flex:1}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}th:nth-child(3),td:nth-child(3){display:none}th,td{font-size:13px;padding:9px 6px}}</style></head><body><header><h1>🚗 Driver Daily Collection</h1><p id="dateText"></p></header><div class="container"><div class="cards"><div class="card"><div class="label">Daily Rent / Driver</div><div class="value" id="daily">—</div></div><div class="card"><div class="label">Active Drivers</div><div class="value" id="driversCount">—</div></div><div class="card"><div class="label">Collected Today</div><div class="value" id="collected">—</div></div><div class="card"><div class="label">Pending Today</div><div class="value" id="pending">—</div></div></div><div class="toolbar"><input id="search" placeholder="Search driver..." oninput="render()"><button class="btn" onclick="openModal()">＋ Add Driver</button><button class="btn secondary" onclick="loadData()">↻ Refresh</button></div><div class="note">Monthly rent: <b>Rs. 85,000</b> · Daily amount is calculated automatically from the current month's days.</div><div id="tableWrap"><div class="loading">Loading drivers…</div></div></div><div class="modal" id="modal"><div class="box"><h2 id="modalTitle">Add Driver</h2><input id="driverName" placeholder="Driver name *"><input id="driverPhone" placeholder="Phone number"><input id="carNumber" placeholder="Car number"><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveDriver()">Save</button></div></div></div><script>
const API="https://mmnxsavyqyviooljrdko.supabase.co/rest/v1",KEY="sb_publishable_FbPVZ0gTJev9Xbomp4TpNg_0GRr38Di",H={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Prefer:"return=representation"},RENT=85000;let drivers=[],payments=[],editingId=null;function pad(n){return String(n).padStart(2,"0")}function today(){let d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}function days(){let d=new Date();return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()}function daily(){return Math.round(RENT/days())}function money(n){return"Rs. "+Number(n).toLocaleString("en-PK")}function esc(s){return String(s||"").replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}async function api(path,o={}){let r=await fetch(API+path,{...o,headers:{...H,...(o.headers||{})}});if(!r.ok)throw Error(await r.text()||r.status);return r.status===204?null:r.json()}async function loadData(){document.getElementById("tableWrap").innerHTML='<div class="loading">Loading drivers…</div>';try{drivers=await api("/drivers?active=eq.true&order=name.asc");payments=await api("/payments?payment_date=eq."+today()+"&select=id,driver_id,payment_date,amount,payment_time");render()}catch(e){document.getElementById("tableWrap").innerHTML='<div class="loading">Database connection error.<br><small>'+esc(e.message)+'</small></div>'}}function render(){let q=document.getElementById("search").value.toLowerCase(),dr=daily(),map={};payments.forEach(p=>map[p.driver_id]=p);let pc=drivers.filter(d=>map[d.id]).length;document.getElementById("daily").textContent=money(dr);document.getElementById("driversCount").textContent=drivers.length;document.getElementById("collected").textContent=money(pc*dr);document.getElementById("pending").textContent=money((drivers.length-pc)*dr);let list=drivers.filter(d=>(d.name+" "+(d.phone||"")+" "+(d.car_number||"")).toLowerCase().includes(q));if(!list.length){document.getElementById("tableWrap").innerHTML='<div class="loading">No drivers found.</div>';return}document.getElementById("tableWrap").innerHTML='<table><thead><tr><th>Driver</th><th>Daily Rent</th><th>Payment Time</th><th>Status</th><th>Action</th></tr></thead><tbody>'+list.map(d=>{let p=map[d.id];return'<tr><td><b>'+esc(d.name)+'</b><br><small>'+esc(d.car_number||"")+(d.phone?' · '+esc(d.phone):'')+'</small></td><td>'+money(dr)+'</td><td>'+(p?new Date(p.payment_time).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}):"—")+'</td><td><button class="status '+(p?'paid':'pending')+'" onclick="togglePayment('+d.id+')">'+(p?'✓ Paid':'Pending')+'</button></td><td><button class="smallbtn edit" onclick="editDriver('+d.id+')">Edit</button><button class="smallbtn del" onclick="deactivate('+d.id+')">Deactivate</button></td></tr>'}).join('')+'</tbody></table>'}function openModal(d=null){editingId=d?d.id:null;document.getElementById("modalTitle").textContent=d?"Edit Driver":"Add Driver";document.getElementById("driverName").value=d?.name||"";document.getElementById("driverPhone").value=d?.phone||"";document.getElementById("carNumber").value=d?.car_number||"";document.getElementById("modal").classList.add("show")}function closeModal(){document.getElementById("modal").classList.remove("show")}function editDriver(id){let d=drivers.find(x=>x.id===id);if(d)openModal(d)}async function saveDriver(){let name=document.getElementById("driverName").value.trim();if(!name)return alert("Driver name enter karein.");let body={name,phone:document.getElementById("driverPhone").value.trim()||null,car_number:document.getElementById("carNumber").value.trim()||null,monthly_rent:RENT,active:true};try{if(editingId)await api("/drivers?id=eq."+editingId,{method:"PATCH",body:JSON.stringify(body)});else await api("/drivers",{method:"POST",body:JSON.stringify(body)});closeModal();loadData()}catch(e){alert("Save failed: "+e.message)}}async function togglePayment(id){let p=payments.find(x=>x.driver_id===id);try{if(p)await api("/payments?id=eq."+p.id,{method:"DELETE"});else await api("/payments",{method:"POST",body:JSON.stringify({driver_id:id,payment_date:today(),amount:daily()})});loadData()}catch(e){alert("Payment update failed: "+e.message)}}async function deactivate(id){if(!confirm("Is driver ko deactivate karna hai?"))return;try{await api("/drivers?id=eq."+id,{method:"PATCH",body:JSON.stringify({active:false})});loadData()}catch(e){alert("Update failed: "+e.message)}}let d=new Date();document.getElementById("dateText").textContent=d.toLocaleDateString("en-PK",{weekday:"long",year:"numeric",month:"long",day:"numeric"});loadData();
</script></body></html>
